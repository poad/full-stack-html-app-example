packages:
  - backend
  - frontend
  - deploy-role

allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  esbuild: true
  unrs-resolver: false

minimumReleaseAge: 10080 # 7 days in minutes
minimumReleaseAgeExclude:
  - pnpm@12.23.0

overrides:
  astro@>=5.14.3 <=7.4.6: ^7.4.7
  chokidar: '>=5'
  semver: '>=7'

trustPolicy: no-downgrade
