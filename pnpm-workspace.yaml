packages:
  - backend
  - frontend
  - deploy-role

allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  esbuild: true
  unrs-resolver: false

minimumReleaseAge: 10080 # 7 days in minutes
minimumReleaseAgeExclude:
  - pnpm@12.19.0

overrides:
  chokidar: '>=5'
  semver: '>=7'

trustPolicy: no-downgrade
