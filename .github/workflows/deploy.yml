name: Deploy

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

  workflow_dispatch: null

env:
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  AWS_REGION: us-west-2

permissions:
  id-token: write
  contents: read

# 同時実行すると CREATE_IN_PROGRESS や UPDATE_IN_PROGRESS 状態で cdk deploy を行う可能性があるため抑止する
concurrency:
  group: "cloudformation-full-stack-html-app-example"
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ !github.event.pull_request.draft }}
    name: Deploy Backend
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ github.event.repository.name }}-deploy-role
          role-session-name: GitHubActions
          aws-region: ${{ env.AWS_REGION }}

      - name: Create backend .env
        run: |
          cat > backend/.env <<EOF
          SESSION_SECRET=${{ secrets.SESSION_SECRET }}
          FRONTEND_URL=${{ secrets.FRONTEND_URL }}
          EOF

      - name: Deploy backend (CDK)
        run: cd backend && ./deploy.sh

      - name: Output stack info
        run: |
          aws cloudformation describe-stacks \
            --stack-name FullStackHtmlAppExampleBackend \
            --region "${{ env.AWS_REGION }}" \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDomainName'].OutputValue" \
            --output text || true
